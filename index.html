</div>

<div class="hand-area">
  <div class="mode-selector">
    <div class="mode-btn active" onclick="setTargetSection('closed', this)">🖐️ 暗手牌區</div>
    <div class="mode-btn" onclick="setTargetSection('open', this)">👁️ 明手牌區</div>
    <div class="mode-btn" onclick="setTargetSection('kong', this)">🔒 槓區</div>
  </div>

  <div class="flower-control">
    <div class="flower-header">
      <span>🌸 花牌配置（共 <span id="flowerTotalDisplay">0</span> 張，每花+2番）</span>
    </div>
    <div class="flower-row">
      <span class="flower-label">🔴 紅花數量：</span>
      <div class="flower-btns" id="redFlowerBtns">
        <button class="f-btn active" onclick="setFlowerTypeCount('red', 0)">0</button>
        <button class="f-btn" onclick="setFlowerTypeCount('red', 1)">1</button>
        <button class="f-btn" onclick="setFlowerTypeCount('red', 2)">2</button>
        <button class="f-btn" onclick="setFlowerTypeCount('red', 3)">3</button>
        <button class="f-btn" onclick="setFlowerTypeCount('red', 4)">4</button>
      </div>
    </div>
    <div class="flower-row">
      <span class="flower-label">🔵 藍花數量：</span>
      <div class="flower-btns" id="blueFlowerBtns">
        <button class="f-btn active" onclick="setFlowerTypeCount('blue', 0)">0</button>
        <button class="f-btn" onclick="setFlowerTypeCount('blue', 1)">1</button>
        <button class="f-btn" onclick="setFlowerTypeCount('blue', 2)">2</button>
        <button class="f-btn" onclick="setFlowerTypeCount('blue', 3)">3</button>
        <button class="f-btn" onclick="setFlowerTypeCount('blue', 4)">4</button>
      </div>
    </div>
  </div>

  <div class="hand-grid">
    <div class="section-box">
      <div class="section-header">🖐️ 暗手牌 (<span id="closedCount">0</span>)</div>
      <div class="section-tiles" id="closedTiles"><div class="empty-hint">無</div></div>
    </div>
    <div class="section-box">
      <div class="section-header">👁️ 明手牌 (<span id="openCount">0</span>)</div>
      <div class="section-tiles" id="openTiles"><div class="empty-hint">無</div></div>
    </div>
    <div class="section-box">
      <div class="section-header">
        <span>🔒 槓區 (<span id="kongCount">0</span>組)</span>
        <span class="kong-type-switch" id="kongTypeLabel" onclick="toggleKongType()">暗槓</span>
      </div>
      <div class="section-tiles" id="kongTiles"><div class="empty-hint">只需點1張</div></div>
    </div>
  </div>
  
  <div class="hand-actions">
    <button class="btn-calc" onclick="calculateSafe()">🧮 計算番數</button>
    <button class="btn-clear" onclick="clearHand()">🗑 清空</button>
    <button class="btn-history2" onclick="toggleHistory()">📋 紀錄 (<span id="historyCount">0</span>)</button>
  </div>
</div>

<div class="result-panel" id="resultPanel">
  <div class="result-header">
    <h2>📊 算番結果</h2>
    <button onclick="closeResult()">✕ 關閉</button>
  </div>
  <div class="result-body" id="resultBody"></div>
</div>

<div class="result-panel" id="historyPanel">
  <div class="result-header">
    <h2>📋 牌局紀錄</h2>
    <button onclick="toggleHistory()">✕ 關閉</button>
  </div>
  <div class="result-body">
    <div class="history-list" id="historyList">

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

function analyzeHand() {
  const counts = {};
  const calcTiles = getTilesForCalculation();
  calcTiles.forEach(id => counts[id] = (counts[id]||0)+1);

  const suits = { wan:[], tong:[], so:[] };
  const winds = [], dragons = [];
  
  for (const id in counts) {
    const t = TILE_MAP[id];
    if (!t) continue;
    if (t.suit === 'wan') suits.wan.push({ num:t.num, count:counts[id] });
    else if (t.suit === 'tong') suits.tong.push({ num:t.num, count:counts[id] });
    else if (t.suit === 'so') suits.so.push({ num:t.num, count:counts[id] });
    else if (t.suit === 'wind') winds.push({ num:t.num, count:counts[id] });
    else if (t.suit === 'dragon') dragons.push({ num:t.num, count:counts[id] });
  }
  return { counts, suits, winds, dragons, redFlowers: redFlowerCount, blueFlowers: blueFlowerCount };
}

function searchMeldsStrict(remCounts, targetNeed, currentMelds, allMelds) {
  if (currentMelds.length === targetNeed) {
    const hasRemaining = Object.values(remCounts).some(c => c > 0);
    if (!hasRemaining) allMelds.push([...currentMelds]);
    return;
  }

  let firstId = null;
  for (const t of TILE_DEFS) {
    if ((remCounts[t.id] || 0) > 0) { firstId = t.id; break; }
  }
  if (!firstId) return;
  const t = TILE_MAP[firstId];

  if ((remCounts[firstId] || 0) >= 3) {
    remCounts[firstId] -= 3;
    currentMelds.push({ type: '刻子', nums: [t.num, t.num, t.num], suit: t.suit, id: t.id });
    searchMeldsStrict(remCounts, targetNeed, currentMelds, allMelds);
    currentMelds.pop();
    remCounts[firstId] += 3;
  }

  if (t.type === 'num' && t.num <= 7) {
    const id2 = `${t.suit}${t.num + 1}`;
    const id3 = `${t.suit}${t.num + 2}`;
    if ((remCounts[firstId] || 0) >= 1 && (remCounts[id2] || 0) >= 1 && (remCounts[id3] || 0) >= 1) {
      remCounts[firstId]--; remCounts[id2]--; remCounts[id3]--;
      currentMelds.push({ type: '順子', nums: [t.num, t.num + 1, t.num + 2], suit: t.suit });
      searchMeldsStrict(remCounts, targetNeed, currentMelds, allMelds);
      currentMelds.pop();
      remCounts[firstId]++; remCounts[id2]++; remCounts[id3]++;
    }
  }
}

function getAllDecompositions(counts) {
  const decompositions = [];
  const tileIds = Object.keys(counts);
  let normalTileCount = 0;
  for (const id of tileIds) normalTileCount += counts[id];

  const targetMeldsCount = (normalTileCount - 2) / 3;
  if (targetMeldsCount < 0 || !Number.isInteger(targetMeldsCount)) return [];

  for (const pairId of tileIds) {
    if (counts[pairId] >= 2) {
      const t = TILE_MAP[pairId];
      const rem = { ...counts };
      rem[pairId] -= 2;
      const meldResults = [];
      searchMeldsStrict(rem, targetMeldsCount, [], meldResults);
      for (const melds of meldResults) {
        decompositions.push({ pair: { suit: t.suit, num: t.num, id: pairId }, melds: melds });
      }
    }
  }
  return decompositions;
}

function evaluateDecomposition(decomp, hand) {
  const { melds, pair } = decomp;
  const matchedIds = [];
  const dynamicDetails = [];
  const { suits, winds, dragons, redFlowers, blueFlowers, counts } = hand;
  const allTiles = getAllSelectedTilesForWall();
  const totalFlowers = redFlowers + blueFlowers;

  if (totalFlowers > 0) matchedIds.push('eachFlower');

  const hasOpenKong = kongSection.some(k => k.type === 'open');
  if (openSection.length === 0 && !hasOpenKong) matchedIds.push('closedHand');

  let openKongCount = 0;
  let closedKongCount = 0;
  kongSection.forEach(k => {
    if (k.type === 'open') openKongCount++;
    else closedKongCount++;
  });

  for (let i = 0; i < openKongCount; i++) matchedIds.push('openKong');
  if (closedKongCount === 1) matchedIds.push('closedKong');
  else if (closedKongCount === 2) matchedIds.push('twoKong');
  else if (closedKongCount === 3) matchedIds.push('threeKong');
  else if (closedKongCount >= 4) matchedIds.push('fourKong');

  let closedTripletsCount = closedKongCount;
  const closedCounts = {};
  closedSection.forEach(id => closedCounts[id] = (closedCounts[id] || 0) + 1);

  melds.forEach(m => {
    if (m.type === '刻子') {
      if (m.id && closedCounts[m.id] >= 3) {
        closedTripletsCount++;
        closedCounts[m.id] -= 3;
      }
    }
  });

  if (closedTripletsCount === 2) matchedIds.push('twoHidden');
  else if (closedTripletsCount === 3) matchedIds.push('threeHidden');
  else if (closedTripletsCount === 4) matchedIds.push('fourHidden');
  else if (closedTripletsCount >= 5) matchedIds.push('fiveHidden');

  const hasFlower = totalFlowers > 0;
  const hasWord = winds.length > 0 || dragons.length > 0;
  const flatWu = meldListsIsFlat(melds);

  if (!hasFlower && !hasWord && flatWu) {
    matchedIds.push('noWordBigFlat');
  } else {
    if (!hasFlower && !hasWord) matchedIds.push('noWordFlower');
    else {
      if (!hasFlower) matchedIds.push('noFlower');
      if (!hasWord) matchedIds.push('noWord');
      else if (hasHonorTripletOrKong(melds)) matchedIds.push('wordTile');
    }
    if (flatWu) matchedIds.push('flatWu');
  }

  if (pair && pair.suit !== 'honor' && [2, 5, 8].includes(pair.num)) {
    matchedIds.push('eyeTile');
  }

  const isBig = isAllBig(counts, winds, dragons);
  const isSmall = isAllSmall(counts, winds, dragons);

  if (isBig) matchedIds.push('allBig');
  else if (isSmall) matchedIds.push('allSmall');
  else {
    if (isMissingFive(counts)) matchedIds.push('missingFive');
  }

  if (isPureOneColor(suits, winds, dragons)) matchedIds.push('pureOneColor');
  if (isMixedOneColor(suits, winds, dragons)) matchedIds.push('mixedOneColor');
  if (isWordOneColor(suits)) matchedIds.push('wordOneColor');
  if (isPureOld(suits, winds, dragons)) matchedIds.push('pureOld');
  if (isMixedOld(suits, winds, dragons)) matchedIds.push('mixedOld');
  if (isNoTerminal(suits, winds, dragons)) matchedIds.push('noTerminal');
  if (isAllTerminal(suits, winds, dragons)) matchedIds.push('allTerminal');
  if (isMissingOne(suits, winds, dragons)) matchedIds.push('missingOne');
  if (melds.every(m => m.type === '刻子') && openSection.length === 0 && openKongCount === 0) matchedIds.push('pongPongWu');

  detectChainPongFromMelds(melds, pair).forEach(r => dynamicDetails.push(r));
  detectBrothersFromMelds(melds, pair).forEach(r => dynamicDetails.push(r));
  detectFourBackFromMelds(melds, pair, counts).forEach(r => dynamicDetails.push(r));

  const threeMeetResult = detectThreeMeetFromMelds(melds);
  const threeMeetKeys = threeMeetResult ? threeMeetResult.threeMeetKeys : new Set();
  if (threeMeetResult) dynamicDetails.push(threeMeetResult);

  detectSistersFromMelds(melds, threeMeetKeys)?.forEach(r => dynamicDetails.push(r));
  detectPairHighFromMelds(melds).forEach(r => dynamicDetails.push(r));

  const mixedTerminalResult = detectMixedTerminalFromMelds(melds, hand);
  if (mixedTerminalResult) dynamicDetails.push(mixedTerminalResult);

  const mixedXResult = detectMixedWithXFromMelds(melds, allTiles);
  if (mixedXResult) dynamicDetails.push(mixedXResult);

  const uniqueMatchedIds = [...new Set(matchedIds)];
  let total = 0;
  let flowerFanTotal = 0;
  const detail = [];

  uniqueMatchedIds.forEach(id => {
    const f = FAN_MAP[id];
    if (f) { 
      if (id === 'eachFlower') {
        const flowerFan = totalFlowers * f.fan;
        flowerFanTotal += flowerFan;
        detail.push({ id: 'eachFlower', name: `花 (紅:${redFlowers}, 藍:${blueFlowers}) ×${totalFlowers}`, fan: flowerFan, cat: '花摸' });
      } else {
        total += f.fan; 
        detail.push(f); 
      }
    }
  });

  total += flowerFanTotal;

  dynamicDetails.forEach(item => {
    total += item.fan;
    detail.push(item);
  });

  return { total, detail };
}

function hasHonorTripletOrKong(melds) { return melds.some(m => m.type === '刻子' && m.suit === 'honor'); }

function detectChainPongFromMelds(melds, pair) {
  const triplets = melds.filter(m => m.type === '刻子' && m.suit !== 'honor');
  const suitMap = {};
  triplets.forEach(t => { if (!suitMap[t.suit]) suitMap[t.suit] = []; suitMap[t.suit].push(t.nums[0]); });
  const results = [];
  const suitNames = { wan:'萬', tong:'筒', so:'索' };

  for (const suit in suitMap) {
    const nums = suitMap[suit].sort((a, b) => a - b);
    const sName = suitNames[suit];
    let consecutiveGroups = [];
    let currentGroup = [nums[0]];
    for (let i = 1; i < nums.length; i++) {
      if (nums[i] === nums[i - 1] + 1) currentGroup.push(nums[i]);
      else { if (currentGroup.length >= 2) consecutiveGroups.push([...currentGroup]); currentGroup = [nums[i]]; }
    }
    if (currentGroup.length >= 2) consecutiveGroups.push([...currentGroup]);

    for (const group of consecutiveGroups) {
      const len = group.length;
      const minN = group[0], maxN = group[group.length - 1];
      let isSmallChain = (pair && pair.suit === suit && (pair.num === minN - 1 || pair.num === maxN + 1));

      if (len >= 3 && !isSmallChain) {
        results.push({ id: 'bigThreeChain', name: `大三連刻（${minN}~${maxN}${sName}）`, fan: 20, cat: '組合', detail: `${len}組相連刻子` });
      } else if (len === 2 && isSmallChain) {
        results.push({ id: 'smallThreeChain', name: `小三連刻（${minN}~${maxN}刻 + ${pair.num}${sName}眼）`, fan: 10, cat: '組合', detail: `2組相連刻子 + 相鄰將眼` });
      } else if (len >= 2) {
        results.push({ id: 'chainPong', name: `連刻（${minN}~${maxN}${sName}）`, fan: 5, cat: '組合', detail: `${len}組相連刻子` });
      }
    }
  }
  return results;
}

function isMissingFive(counts) { return ['wan5', 'tong5', 'so5'].every(id => !counts[id] || counts[id] === 0); }

function isAllBig(counts, winds, dragons) {
  if (winds.length > 0 || dragons.length > 0) return false;
  let hasNum = false;
  for (const id in counts) {
    const t = TILE_MAP[id];
    if (!t) continue;
    if (t.type === 'honor') return false;
    hasNum = true;
    if (t.num < 6) return false;
  }
  return hasNum;
}

function isAllSmall(counts, winds, dragons) {
  if (winds.length > 0 || dragons.length > 0) return false;
  let hasNum = false;
  for (const id in counts) {
    const t = TILE_MAP[id];
    if (!t) continue;
    if (t.type === 'honor') return false;
    hasNum = true;
    if (t.num > 4) return false;
  }
  return hasNum;
}

function detectFourBackFromMelds(melds, pair, counts) {
  const results = [];
  const suitNames = { wan:'萬', tong:'筒', so:'索' };

  for (const id in counts) {
    if (counts[id] === 4) {
      const t = TILE_MAP[id];
      if (!t) continue;
      const isPair = (pair && pair.id === id);
      const seqMeldsCount = melds.filter(m => m.type === '順子' && m.suit === t.suit && m.nums.includes(t.num)).length;
      const tripletMeldsCount = melds.filter(m => m.type === '刻子' && m.id === id).length;
      const displayLabel = `${t.label}${suitNames[t.suit]||''}`;

      if (seqMeldsCount === 4) {
        results.push({ id: 'fourBack4', name: `四歸四（${displayLabel}）`, fan: 60, cat: '組合', detail: `4張${displayLabel}完全拆入4個順子之中` });
      } else if (isPair) {
        results.push({ id: 'fourBack2', name: `四歸二（${displayLabel}）`, fan: 30, cat: '組合', detail: `4張${displayLabel}用盡，其中2張作為將眼` });
      } else if (seqMeldsCount >= 1 || tripletMeldsCount >= 1) {
        results.push({ id: 'fourBack1', name: `四歸一（${displayLabel}）`, fan: 15, cat: '組合', detail: `4張${displayLabel}用盡於面子之中` });
      }
    }
  }
  return results;
}

function detectBrothersFromMelds(melds, pair) {
  const triplets = melds.filter(m => m.type === '刻子' && m.suit !== 'honor');
  const numMap = {};
  triplets.forEach(t => { if (!numMap[t.nums[0]]) numMap[t.nums[0]] = new Set(); numMap[t.nums[0]].add(t.suit); });
  const results = [];
  const suitNames = { wan:'萬', tong:'筒', so:'索' };

  for (const num in numMap) {
    const suitsArr = [...numMap[num]];
    const n = Number(num);
    if (suitsArr.length === 3) {
      results.push({ id: 'bigBrothers', name: `大兄弟（${n}萬筒索）`, fan: 30, cat: '組合', detail: `${n}萬、${n}筒、${n}索 三組刻子` });
    } else if (suitsArr.length === 2) {
      const s1 = suitNames[suitsArr[0]], s2 = suitNames[suitsArr[1]];
      if (pair && pair.suit !== 'honor' && pair.num === n && !suitsArr.includes(pair.suit)) {
        results.push({ id: 'smallBrothers', name: `小兄弟（${n}${s1}&${s2} + ${n}${suitNames[pair.suit]}眼）`, fan: 15, cat: '組合', detail: `兩組刻子 + 一對相同數字眼` });
      } else {
        results.push({ id: 'brothers', name: `兄弟（${n}${s1}&${s2}）`, fan: 5, cat: '組合', detail: `兩組相同數字不同花色刻子` });
      }
    }
  }
  return results;
}

function meldListsIsFlat(melds) { if (melds.length === 0) return false; return melds.every(m => m.type === '順子'); }

function detectThreeMeetFromMelds(melds) {
  const sequences = melds.filter(m => m.type === '順子');
  const seqMap = {};
  sequences.forEach(m => { const key = m.nums.join(','); if (!seqMap[key]) seqMap[key] = {}; seqMap[key][m.suit] = (seqMap[key][m.suit] || 0) + 1; });
  let totalCount = 0; const details = []; const threeMeetKeys = new Set();
  for (const key in seqMap) {
    const sc = seqMap[key];
    const count = Math.min(sc.wan || 0, sc.tong || 0, sc.so || 0);
    if (count > 0) { totalCount += count; details.push(`${key.replace(/,/g,'')}萬筒索 ×${count}`); threeMeetKeys.add(key); }
  }
  if (totalCount === 0) return null;
  return { id: 'threeMeet1', name: `三相逢 ×${totalCount}組`, fan: 10 * totalCount, cat: '組合', detail: details.join('、'), threeMeetKeys };
}

function detectSistersFromMelds(melds, threeMeetKeys) {
  const sequences = melds.filter(m => m.type === '順子');
  const seqMap = {};
  sequences.forEach(m => { const key = m.nums.join(','); if (!seqMap[key]) seqMap[key] = {}; seqMap[key][m.suit] = (seqMap[key][m.suit] || 0) + 1; });
  let totalSisterPairs = 0; const details = []; const suitNames = { wan:'萬', tong:'筒', so:'索' };
  for (const key in seqMap) {
    if (threeMeetKeys && threeMeetKeys.has(key)) continue;
    const suitCounts = seqMap[key]; const suitsArr = Object.keys(suitCounts);
    if (suitsArr.length >= 2) {
      for (let i = 0; i < suitsArr.length; i++) {
        for (let j = i + 1; j < suitsArr.length; j++) {
          const pairs = suitCounts[suitsArr[i]] * suitCounts[suitsArr[j]];
          if (pairs > 0) { totalSisterPairs += pairs; details.push(`${key.replace(/,/g,'')}(${suitNames[suitsArr[i]]}&${suitNames[suitsArr[j]]}) ×${pairs}`); }
        }
      }
    }
  }
  if (totalSisterPairs === 0) return null;
  return { id: 'sisters', name: `姊妹 ×${totalSisterPairs}組`, fan: 3 * totalSisterPairs, cat: '組合', detail: details.join('、') };
}

function detectPairHighFromMelds(melds) {
  const sequences = melds.filter(m => m.type === '順子');
  const seqMap = {};
  sequences.forEach(m => { const key = `${m.suit}_${m.nums.join(',')}`; seqMap[key] = (seqMap[key] || 0) + 1; });
  const results = []; const suitNames = { wan:'萬', tong:'筒', so:'索' };
  for (const key in seqMap) {
    const count = seqMap[key]; const [suit, numsStr] = key.split('_'); const displaySeq = `${numsStr.replace(/,/g,'')}${suitNames[suit]}`;
    if (count === 2) results.push({ id: 'doublePairHigh1', name: `雙般高（${displaySeq}）`, fan: 5, cat: '組合', detail: `兩組相同的順子` });
    else if (count === 3) results.push({ id: 'triplePairHigh', name: `三般高（${displaySeq}）`, fan: 20, cat: '組合', detail: `三組相同的順子` });
    else if (count >= 4) results.push({ id: 'quadPairHigh', name: `四般高（${displaySeq}）`, fan: 100, cat: '組合', detail: `四組相同的順子` });
  }
  return results;
}

function detectMixedWithXFromMelds(melds, tiles) {
  if (melds.length === 0) return null;
  const meldNumSets = melds.map(m => new Set(m.nums));
  let intersection = new Set(meldNumSets[0]);
  for (let i = 1; i < meldNumSets.length; i++) intersection = new Set([...intersection].filter(x => meldNumSets[i].has(x)));
  const xList = [...intersection].sort((a,b)=>a-b);
  if (xList.length === 0) return null;
  const fan = xList.length * 30;
  return { id: 'mixedWithX', name: `混帶X（${xList.map(n=>`混${n}`).join('、')}）`, fan: fan, cat: '大牌', detail: `${xList.length} 個數字 × 30 番 = ${fan} 番` };
}

function detectMixedTerminalFromMelds(melds, hand) {
  const { winds, dragons } = hand;
  if (winds.length === 0 && dragons.length === 0) return null;
  if (melds.length === 0) return null;
  if (!melds.every(m => m.nums.some(n => n === 1 || n === 9))) return null;
  return { id: 'mixedTerminal', name: '混帶幺', fan: 30, cat: '大牌', detail: '有字牌且所有面子都包含幺（1或9）' };
}

function isMixedOneColor(suits, winds, dragons) { return [suits.wan.length>0, suits.tong.length>0, suits.so.length>0].filter(Boolean).length === 1 && (winds.length>0 || dragons.length>0); }
function isPureOneColor(suits, winds, dragons) { return [suits.wan.length>0, suits.tong.length>0, suits.so.length>0].filter(Boolean).length === 1 && winds.length===0 && dragons.length===0; }
function isWordOneColor(suits) { return [suits.wan.length>0, suits.tong.length>0, suits.so.length>0].filter(Boolean).length === 0; }
function isMissingOne(suits, winds, dragons) { if (winds.length > 0 || dragons.length > 0) return false; return [suits.wan.length>0, suits.tong.length>0, suits.so.length>0].filter(Boolean).length === 2; }
function isNoTerminal(suits, winds, dragons) {
  if (winds.length>0 || dragons.length>0) return false;
  for (const s of ['wan','tong','so']) for (const t of suits[s]) if (t.num === 1 || t.num === 9) return false;
  return true;
}
function isMixedOld(suits, winds, dragons) {
  if (winds.length===0 && dragons.length===0) return false;
  for (const s of ['wan','tong','so']) for (const t of suits[s]) if (t.num !== 1 && t.num !== 9) return false;
  return true;
}
function isPureOld(suits, winds, dragons) {
  if (winds.length>0 || dragons.length>0) return false;
  let hasTile = false;
  for (const s of ['wan','tong','so']) for (const t of suits[s]) { hasTile = true; if (t.num !== 1 && t.num !== 9) return false; }
  return hasTile;
}
function isAllTerminal(suits, winds, dragons) {
  for (const s of ['wan','tong','so']) for (const t of suits[s]) if (t.num !== 1 && t.num !== 9) return false;
  return winds.length>0 || dragons.length>0 || suits.wan.length+suits.tong.length+suits.so.length>0;
}

function calculateSafe() {
  try {
    const totalTilesCount = openSection.length + closedSection.length + (kongSection.length * 3);
    if (totalTilesCount !== 17) {
      showToast(`牌數不符（目前計算張數 ${totalTilesCount} 張，總計須為 17 張）`);
      return;
    }

    const hand = analyzeHand();
    const hiddenAndOpenTiles = [...openSection, ...closedSection];
    kongSection.forEach(k => hiddenAndOpenTiles.push(k.id, k.id, k.id));

    const countsForDecomp = {};
    hiddenAndOpenTiles.forEach(id => countsForDecomp[id] = (countsForDecomp[id]||0)+1);

    const decompositions = getAllDecompositions(countsForDecomp);

    if (decompositions.length === 0) {
      resultData = { total: 0, detail: [], handTiles: getAllSelectedTilesForWall() };
      renderResult(0, []);
      switchTab('result', document.querySelectorAll('.tab')[1]);
      document.getElementById('resultPanel').classList.add('show');
      return;
    }

    let bestResult = { total: -1, detail: [] };
    for (const decomp of decompositions) {
      const res = evaluateDecomposition(decomp, hand);
      if (res.total > bestResult.total) bestResult = res;
    }

    resultData = { total: bestResult.total, detail: bestResult.detail, handTiles: getAllSelectedTilesForWall() };
    renderResult(bestResult.total, bestResult.detail);
    switchTab('result', document.querySelectorAll('.tab')[1]);
    document.getElementById('resultPanel').classList.add('show');
  } catch (err) {
    console.error(err);
    alert("計算過程發生例外錯誤：" + err.message);
  }
}

function renderResult(total, detail) {
  const body = document.getElementById('resultBody');
  if (detail.length === 0) {
    body.innerHTML = `
      <div class="result-total"><div class="num">0</div><div class="label">番</div></div>
      <div class="result-none">未偵測到任何合法食糊牌型<br>請確認各分區配置是否正確（是否符合面子結構）</div>
    `;
    return;
  }

  const grouped = {};
  detail.forEach(f => {
    const cat = f.cat || '其他';
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push(f);
  });

  const catOrder = ['花摸','槓摸','基本','組合','大牌','額外'];
  const sortedCats = Object.keys(grouped).sort((a,b) => catOrder.indexOf(a) - catOrder.indexOf(b));

  body.innerHTML = `
    <div class="result-total">
      <div class="num">${total}</div>
      <div class="label">總番數（各分區檢測 + 最高番數優先）</div>
    </div>
    ${sortedCats.map(cat => `
      <div style="font-size:12px;color:#f7971e;font-weight:700;padding:8px 4px 4px;">${cat}</div>${grouped[cat].map(f => `
        <div class="result-item highlight">
          <div>
            <div class="r-name">${f.name}</div>
            ${f.detail ? `<div style="font-size:10px;color:#888;margin-top:2px;">${f.detail}</div>` : ''}
          </div>
          <span class="r-fan">+${f.fan}番</span>
        </div>
      `).join('')}
    `).join('')}
    <div class="result-note">
      ※ 將眼（2/5/8）僅限數字牌（風字眼不計）<br>
      ※ 槓牌自動整合至17張牌型計算中，不再重複獨立計算「槓摸」番數<br>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button onclick="saveResult()" style="flex:1;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,#27ae60,#1e8449);color:#fff;font-size:14px;font-weight:700;cursor:pointer;">💾 儲存本局</button>
      <button onclick="closeResult()" style="flex:1;padding:12px;border-radius:10px;border:none;background:#16213e;color:#ffd200;font-size:14px;font-weight:700;cursor:pointer;border:1px solid #f7971e55;">返回</button>
    </div>
  `;
}

function closeResult() { document.getElementById('resultPanel').classList.remove('show'); }

function saveResult() {
  if (!resultData) return;
  const now = new Date();
  const timeStr = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  historyData.unshift({
    total: resultData.total,
    details: resultData.detail.map(f => `${f.name}(${f.fan}番)`).join('、'),
    time: timeStr,
    tiles: `花(紅:${redFlowerCount},藍:${blueFlowerCount}) | ` + resultData.handTiles.map(id => TILE_MAP[id]?.label || '?').join(' ')
  });
  renderHistory();
  showToast(`已儲存：${resultData.total}番`);
  closeResult();
  resultData = null;
}

function renderHistory() {
  const list = document.getElementById('historyList');
  document.getElementById('historyCount').textContent = historyData.length;
  if (historyData.length === 0) { list.innerHTML = '<div class="empty-state">暫無紀錄</div>'; return; }
  list.innerHTML = historyData.map(h => `
    <div class="history-item">
      <div class="h-total">${h.total} 番</div>
      <div class="h-detail">${h.details}</div>
      <div class="h-time">${h.time}</div>
      <div class="h-time" style="color:#556;">🀫 ${h.tiles}</div>
    </div>
  `).join('');
}

function toggleHistory() {
  const panel = document.getElementById('historyPanel');
  panel.classList.toggle('show');
  renderHistory();
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1300);
}

renderWall();
refreshUI();
</script>
